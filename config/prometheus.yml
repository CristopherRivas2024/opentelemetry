# Prometheus — Metrics backend configuration
# Note: --web.enable-remote-write-receiver and retention flags are set
# via docker-compose command arguments, not here.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # OpenTelemetry Collector self-metrics
  - job_name: "otel-gateway"
    static_configs:
      - targets: ["otel-gateway:8888"]
    metrics_path: /metrics

  # Grafana internal metrics
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
    metrics_path: /metrics

  # n8n /metrics endpoint (external server)
  # Requires: N8N_METRICS=true on the n8n instance, network reachability,
  # and N8N_HOST_IP defined in this stack's environment.
  # Uncomment and set the IP when ready. See docs/n8n-integration.md.
  # - job_name: "n8n"
  #   static_configs:
  #     - targets: ["<n8n-host-ip>:5678"]
  #   metrics_path: /metrics
  #   scheme: http
