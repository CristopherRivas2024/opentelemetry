# Central Observability Stack
# Services: otel-gateway, tempo, loki, prometheus, grafana
#
# Usage:
#   cp .env.example .env    # fill in secrets
#   docker compose up -d
#   open http://localhost:3000
#
# Note on configs: backend YAMLs are embedded as top-level `configs:` so the
# stack is portable to any Portainer/Docker host without depending on bind
# mounts. To edit a config, modify the `content:` block below and redeploy.

name: observability

networks:
  observability:
    driver: bridge

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:

configs:
  otel_gateway_config:
    content: |
      # OpenTelemetry Collector — Gateway configuration
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"

      processors:
        memory_limiter:
          limit_mib: 512
          spike_limit_mib: 128
          check_interval: 1s

        resource:
          attributes:
            - key: deployment.environment
              value: production
              action: upsert

        batch:
          timeout: 5s
          send_batch_size: 1024
          send_batch_max_size: 2048

      exporters:
        otlphttp/tempo:
          endpoint: "http://tempo:4318"
          tls:
            insecure: true

        loki:
          endpoint: "http://loki:3100/loki/api/v1/push"

        prometheusremotewrite:
          endpoint: "http://prometheus:9090/api/v1/write"
          tls:
            insecure: true

      extensions:
        health_check:
          endpoint: "0.0.0.0:13133"

      service:
        extensions: [health_check]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, resource, batch]
            exporters: [otlphttp/tempo]

          logs:
            receivers: [otlp]
            processors: [memory_limiter, resource, batch]
            exporters: [loki]

          metrics:
            receivers: [otlp]
            processors: [memory_limiter, resource, batch]
            exporters: [prometheusremotewrite]

  tempo_config:
    content: |
      # Grafana Tempo — Distributed tracing backend configuration
      stream_over_http_enabled: true

      server:
        http_listen_port: 3200
        log_level: info

      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: "0.0.0.0:4317"
              http:
                endpoint: "0.0.0.0:4318"

      ingester:
        max_block_duration: 5m

      compactor:
        compaction:
          block_retention: 168h
        ring:
          kvstore:
            store: memberlist

      metrics_generator:
        registry:
          external_labels:
            source: tempo
        storage:
          path: /var/tempo/generator/wal
          remote_write:
            - url: http://prometheus:9090/api/v1/write
              send_exemplars: true
        processor:
          service_graphs:
            histogram_buckets: [0.1, 0.2, 0.4, 0.8, 1.6, 3.2, 6.4, 12.8]
          span_metrics:
            histogram_buckets: [0.002, 0.004, 0.008, 0.016, 0.032, 0.064, 0.128, 0.256, 0.512, 1.02, 2.05, 4.10]

      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/blocks
          wal:
            path: /var/tempo/wal

      overrides:
        defaults:
          metrics_generator:
            processors: [service-graphs, span-metrics]

  loki_config:
    content: |
      # Grafana Loki — Log aggregation backend configuration
      auth_enabled: false

      server:
        http_listen_port: 3100
        grpc_listen_port: 9096
        log_level: info

      target: all

      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      query_range:
        results_cache:
          cache:
            embedded_cache:
              enabled: true
              max_size_mb: 100

      schema_config:
        configs:
          - from: 2020-10-24
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      limits_config:
        retention_period: 336h
        reject_old_samples: true
        reject_old_samples_max_age: 168h

      compactor:
        working_directory: /loki/compactor
        retention_enabled: true
        delete_request_store: filesystem

      ruler:
        alertmanager_url: http://localhost:9093

      analytics:
        reporting_enabled: false

  prometheus_config:
    content: |
      # Prometheus — Metrics backend configuration
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
        scrape_timeout: 10s

      scrape_configs:
        - job_name: "otel-gateway"
          static_configs:
            - targets: ["otel-gateway:8888"]
          metrics_path: /metrics

        - job_name: "grafana"
          static_configs:
            - targets: ["grafana:3000"]
          metrics_path: /metrics

  # Grafana datasources — simplified inline version.
  # Cross-link templates (Tempo<->Loki, derived fields, service-map vars)
  # are intentionally omitted here: Compose interprets ${...} as env-var
  # substitution inside content blocks, which collides with Grafana's own
  # variable syntax. Full provisioning (datasources w/ cross-links +
  # dashboards + alerts) is pending a separate migration.
  grafana_datasources_config:
    content: |
      apiVersion: 1

      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false
          jsonData:
            timeInterval: "15s"

        - name: Tempo
          type: tempo
          uid: tempo
          access: proxy
          url: http://tempo:3200
          isDefault: false
          editable: false
          jsonData:
            httpMethod: GET
            serviceMap:
              datasourceUid: prometheus
            nodeGraph:
              enabled: true

        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki:3100
          isDefault: false
          editable: false

services:
  # ──────────────────────────────────────────────────────────
  # OpenTelemetry Collector — Gateway
  # Receives OTLP signals from all services and routes them
  # to Tempo (traces), Loki (logs), Prometheus (metrics).
  # ──────────────────────────────────────────────────────────
  otel-gateway:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: otel-gateway
    restart: unless-stopped
    ports:
      - "0.0.0.0:${OTEL_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_METRICS_PORT:-8888}:8888"
    configs:
      - source: otel_gateway_config
        target: /etc/otelcol-contrib/config.yaml
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:13133"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────────────────
  # Tempo — Distributed tracing backend
  # ──────────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.7.0
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - "127.0.0.1:${TEMPO_HTTP_PORT:-3200}:3200"
    volumes:
      - tempo-data:/var/tempo
    configs:
      - source: tempo_config
        target: /etc/tempo/config.yaml
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ──────────────────────────────────────────────────────────
  # Loki — Log aggregation backend
  # ──────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.4.0
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "127.0.0.1:${LOKI_HTTP_PORT:-3100}:3100"
    volumes:
      - loki-data:/loki
    configs:
      - source: loki_config
        target: /etc/loki/config.yaml
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ──────────────────────────────────────────────────────────
  # Prometheus — Metrics backend
  # ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.2.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-remote-write-receiver"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ──────────────────────────────────────────────────────────
  # Grafana — Visualization and alerting
  # Datasources are provisioned via inline `configs:` (simplified, no
  # cross-link templates). Dashboards and alert rules are NOT provisioned
  # yet — pending the full migration of grafana/provisioning/. Until then
  # add them via UI or do another change to inline them.
  # ──────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.5.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "0.0.0.0:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana_datasources_config
        target: /etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-changeme}
      - GF_FEATURE_TOGGLES_ENABLE=traceToLogs correlations
      - GF_ANALYTICS_REPORTING_ENABLED=false
    depends_on:
      - tempo
      - loki
      - prometheus
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
