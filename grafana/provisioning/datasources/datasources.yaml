# Grafana Datasources — Provisioned automatically on startup.
# All datasources are editable: false to enforce IaC discipline.

apiVersion: 1

datasources:
  # ──────────────────────────────────────────────────────────
  # Prometheus — metrics, set as default datasource
  # ──────────────────────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      # Link exemplars in metrics to traces in Tempo
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: "View trace in Tempo"

  # ──────────────────────────────────────────────────────────
  # Tempo — distributed traces
  # ──────────────────────────────────────────────────────────
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      httpMethod: GET
      # Trace to Logs cross-link (Tempo → Loki)
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        tags:
          - key: service.name
            value: service_name
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{service_name="${__span.tags["service.name"]}"} |= "${__span.traceId}"'
      # Service map using Prometheus metrics generated by Tempo
      serviceMap:
        datasourceUid: prometheus
      # Enable node graph for trace visualization
      nodeGraph:
        enabled: true
      # Loki log search integration
      lokiSearch:
        datasourceUid: loki
      # Trace ID key for searching
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"

  # ──────────────────────────────────────────────────────────
  # Loki — logs
  # ──────────────────────────────────────────────────────────
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      # Derived field to extract trace IDs from log lines and link to Tempo
      derivedFields:
        - name: TraceID
          matcherRegex: 'trace_id=(\w+)'
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: "View trace in Tempo"
